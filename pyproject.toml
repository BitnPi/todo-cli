[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "Python CLI to-do app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools.packages.find]
include = ["todo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.10"
packages = ["todo"]
strict = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
