name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Upgrading matters: pip-audit also checks the packaging tools preinstalled
      # with the interpreter, and the old ones have known vulnerabilities.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: pytest
        run: pytest

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy todo

      - name: bandit
        run: bandit -c pyproject.toml -r todo

      # --skip-editable: todo-cli itself isn't on PyPI, so it can't be audited.
      - name: pip-audit
        if: matrix.python-version != '3.10'
        run: pip-audit --skip-editable

      # filelock is only used by pip-audit, and no fixed release supports 3.10
      # (see requirements-dev.txt). Both advisories need a hostile local user,
      # which a CI runner doesn't have. Remove this step along with 3.10 support.
      #   GHSA-8mx5-7m5m-r77g: Windows only, lock file ACLs
      #   GHSA-69hj-f68j-2879: hard link or rename onto the lock path
      - name: pip-audit (Python 3.10)
        if: matrix.python-version == '3.10'
        run: >-
          pip-audit --skip-editable
          --ignore-vuln GHSA-8mx5-7m5m-r77g
          --ignore-vuln GHSA-69hj-f68j-2879
